<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/jpeg" href="/favicon.jpg">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>My Photos — MH Captures/Media</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --bg: #0a0a0a; --text: #d4af37; --text-sec: #c9a227; --text-muted: #a08830; --border: rgba(212,175,55,0.15); }
  body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); overflow-x: hidden; }
  nav { position: sticky; top: 0; z-index: 100; display: flex; justify-content: space-between; align-items: center; padding: 0.85rem 1.5rem; background: rgba(10,10,10,0.88); border-bottom: 0.5px solid var(--border); backdrop-filter: blur(8px); }
  .nav-logo { font-family: 'Cormorant Garamond', serif; font-size: 18px; letter-spacing: 0.08em; color: var(--text); text-decoration: none; }
  .nav-logo span { font-style: italic; color: #a08c2a; }
  .nav-btn { font-family: inherit; font-size: 13px; color: var(--text-muted); background: none; border: 0.5px solid rgba(212,175,55,0.4); padding: 6px 14px; cursor: pointer; border-radius: 0; }
  .nav-btn:hover { color: var(--text); border-color: var(--text); }
  .gallery-header { text-align: center; padding: 3rem 1rem 2rem; border-bottom: 0.5px solid var(--border); }
  .gallery-header p { font-size: 11px; letter-spacing: 0.18em; color: var(--text-muted); text-transform: uppercase; margin-bottom: 0.75rem; }
  .gallery-header h1 { font-family: 'Cormorant Garamond', serif; font-size: 42px; font-weight: 300; }
  .gallery-header h1 em { font-style: italic; }
  .gallery-header .count { margin-top: 0.75rem; margin-bottom: 0; letter-spacing: 0.08em; text-transform: none; font-size: 13px; }
  .gallery-grid { columns: 3; gap: 4px; padding: 1rem; }
  .gallery-item { break-inside: avoid; margin-bottom: 4px; overflow: hidden; cursor: pointer; position: relative; }
  .gallery-item img { width: 100%; display: block; transition: transform 0.5s ease; }
  .gallery-item:hover img { transform: scale(1.04); }
  .dl { position: absolute; right: 8px; bottom: 8px; background: rgba(10,10,10,0.8); color: var(--text); border: 0.5px solid rgba(212,175,55,0.5); font-size: 12px; padding: 5px 10px; text-decoration: none; opacity: 0; transition: opacity 0.2s; }
  .gallery-item:hover .dl { opacity: 1; }
  @media (hover: none) { .dl { opacity: 1; } }
  .state { text-align: center; padding: 4rem 1rem; font-size: 14px; color: var(--text-muted); line-height: 1.7; }
  .spinner { width: 32px; height: 32px; border: 2px solid rgba(212,175,55,0.2); border-top-color: #d4af37; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 1rem; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .lightbox { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 200; align-items: center; justify-content: center; padding: 1rem; }
  .lightbox.show { display: flex; }
  .lightbox img { max-width: 100%; max-height: 86vh; object-fit: contain; }
  .lb-btn { position: absolute; background: none; border: none; color: var(--text-muted); cursor: pointer; }
  .lb-close { top: 1rem; right: 1.25rem; font-size: 28px; }
  .lb-prev, .lb-next { top: 50%; transform: translateY(-50%); font-size: 36px; padding: 1rem; }
  .lb-prev { left: 0; } .lb-next { right: 0; }
  .lb-dl { bottom: 1.25rem; left: 50%; transform: translateX(-50%); font-size: 13px; color: var(--text); border: 0.5px solid rgba(212,175,55,0.5); padding: 8px 18px; text-decoration: none; }
  footer { text-align: center; padding: 2rem 1rem; border-top: 0.5px solid var(--border); font-size: 12px; color: var(--text-muted); }
  @media (max-width: 768px) { .gallery-grid { columns: 2; } }
  @media (max-width: 480px) { .gallery-grid { columns: 1; } .gallery-header h1 { font-size: 30px; } }
</style>
</head>
<body>

<nav>
  <a href="/index.html" class="nav-logo">MH <span>Captures/Media</span></a>
  <button class="nav-btn" id="signout">Sign out</button>
</nav>

<div class="gallery-header">
  <p>Private gallery</p>
  <h1 id="title">Your <em>Photos</em></h1>
  <p class="count" id="count"></p>
</div>

<div id="content"><div class="state"><div class="spinner"></div>Loading your photos…</div></div>

<div class="lightbox" id="lb">
  <button class="lb-btn lb-close" id="lb-close" aria-label="Close">×</button>
  <button class="lb-btn lb-prev" id="lb-prev" aria-label="Previous">‹</button>
  <img id="lb-img" alt="">
  <button class="lb-btn lb-next" id="lb-next" aria-label="Next">›</button>
  <a class="lb-btn lb-dl" id="lb-dl" href="#">Download</a>
</div>

<footer>© 2026 MH Captures/Media · London, Ontario · Photos are for your personal use. Questions? mhmedia@mhcapturesmedia.com</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  // ── FILL THESE IN (same values as login.html) ──
  const SUPABASE_URL = 'https://oxrwgxthlilbkflanyzm.supabase.co';
  const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable__w2Thdi0bCJ-MhUmFDshkA_-dAcwNYr';
  // ───────────────────────────────────────────────

  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
  const $ = (id) => document.getElementById(id);
  let photos = [], cur = 0;

  function state(html) { $('content').innerHTML = '<div class="state">' + html + '</div>'; }

  async function load() {
    const { data } = await sb.auth.getSession();
    if (!data.session) { location.replace('/login.html'); return; }

    let res;
    try {
      res = await fetch('/.netlify/functions/get-client-photos', {
        headers: { Authorization: 'Bearer ' + data.session.access_token }
      });
    } catch (e) {
      state('Could not reach the server. Please refresh and try again.');
      return;
    }

    if (res.status === 401) { await sb.auth.signOut(); location.replace('/login.html'); return; }
    const body = await res.json().catch(() => ({}));
    if (!res.ok) { state(body.error || 'Something went wrong.'); return; }

    if (body.name) $('title').innerHTML = body.name.split(' ')[0] + '’s <em>Photos</em>';
    photos = body.photos || [];
    if (!photos.length) {
      state('Your photos aren’t ready yet.<br>You’ll get an email from MH Captures/Media when they are.');
      return;
    }
    $('count').textContent = photos.length + ' photo' + (photos.length === 1 ? '' : 's');

    const grid = document.createElement('div');
    grid.className = 'gallery-grid';
    photos.forEach((p, i) => {
      const item = document.createElement('div');
      item.className = 'gallery-item';
      item.innerHTML = '<img loading="lazy" alt="Photo ' + (i + 1) + '" src="' + p.thumb + '">' +
        '<a class="dl" href="' + p.download + '">Download</a>';
      item.addEventListener('click', (e) => { if (!e.target.closest('.dl')) open(i); });
      grid.appendChild(item);
    });
    $('content').innerHTML = '';
    $('content').appendChild(grid);
  }

  function open(i) {
    cur = i;
    $('lb-img').src = photos[i].full;
    $('lb-dl').href = photos[i].download;
    $('lb').classList.add('show');
  }
  const close = () => $('lb').classList.remove('show');
  const step = (d) => open((cur + d + photos.length) % photos.length);

  $('lb-close').onclick = close;
  $('lb-prev').onclick = () => step(-1);
  $('lb-next').onclick = () => step(1);
  $('lb').addEventListener('click', (e) => { if (e.target.id === 'lb') close(); });
  document.addEventListener('keydown', (e) => {
    if (!$('lb').classList.contains('show')) return;
    if (e.key === 'Escape') close();
    if (e.key === 'ArrowLeft') step(-1);
    if (e.key === 'ArrowRight') step(1);
  });

  $('signout').onclick = async () => { await sb.auth.signOut(); location.href = '/login.html'; };

  load();
</script>
</body>
</html>
